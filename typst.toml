[package]
name = "tuftelike"
version = "0.1.0"
entrypoint = "src/lib.typ"
authors = ["Clay Loveless <clay@loveless.net>"]
license = "MIT"
description = "Tufte-style templates: books, letters, handouts, and print-ready wrap covers with margin-note-first layout"
repository = "https://github.com/claylo/tuftelike"
keywords = ["tufte", "book", "letter", "template", "margin-notes", "print"]
categories = ["book", "layout"]
compiler = "0.15.0"

[template]
path = "template"
entrypoint = "main.typ"
